<meta charset="utf-8">
<title>Know Your Plant — Interactive Prototype</title>
<style>
  :root{
    --ink:#0E1A20;--ink-2:#22343C;--mist:#F4F7F6;--paper:#FBFCFC;
    --line:#DCE5E4;--line-2:#E9EEED;--muted:#5F7278;--muted-2:#8B9DA0;
    --accent:#0E9E97;--accent-deep:#0A6E6A;--accent-wash:#E4F3F1;
    --water:#2C7BE5;--water-wash:#E7F0FD;
    --good:#1F9D6B;--good-wash:#E4F4EC;--warn:#C9871A;--warn-wash:#FBF0DA;
    --crit:#D8483C;--crit-wash:#FBE7E4;--card:#FFF;
    --shadow:0 1px 2px rgba(14,26,32,.05),0 10px 30px rgba(14,26,32,.06);
    --disp:"Helvetica Neue",Arial,ui-sans-serif,system-ui,sans-serif;
    --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"]{
    --ink:#EAF1F0;--ink-2:#C4D2D2;--mist:#0B1317;--paper:#0F1A1F;
    --line:#22333A;--line-2:#1A2A30;--muted:#8FA2A6;--muted-2:#67797D;
    --accent:#2CC2BA;--accent-deep:#7FE0D9;--accent-wash:#11302F;
    --water:#5B9CF0;--water-wash:#14263C;--good:#3FBE88;--good-wash:#122A20;
    --warn:#E0A83C;--warn-wash:#2E2410;--crit:#EE6A5E;--crit-wash:#331916;
    --card:#132127;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ink:#EAF1F0;--ink-2:#C4D2D2;--mist:#0B1317;--paper:#0F1A1F;
    --line:#22333A;--line-2:#1A2A30;--muted:#8FA2A6;--muted-2:#67797D;
    --accent:#2CC2BA;--accent-deep:#7FE0D9;--accent-wash:#11302F;
    --water:#5B9CF0;--water-wash:#14263C;--good:#3FBE88;--good-wash:#122A20;
    --warn:#E0A83C;--warn-wash:#2E2410;--crit:#EE6A5E;--crit-wash:#331916;
    --card:#132127;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}

  /* ===== App frame ===== */
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;max-width:1240px;margin:0 auto;background:var(--paper);}
  /* sidebar */
  .side{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;}
  .brand .logo{font-size:20px;}
  .brand b{font-family:var(--disp);font-weight:800;letter-spacing:-.01em;font-size:16px;}
  .brand small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);}
  .navlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);padding:14px 8px 6px;}
  .nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;border:none;background:none;color:var(--ink-2);font-size:14px;width:100%;text-align:left;transition:.12s;}
  .nav .ic{width:18px;text-align:center;font-size:15px;opacity:.85;}
  .nav:hover{background:var(--mist);}
  .nav.on{background:var(--accent-wash);color:var(--accent-deep);font-weight:600;}
  .nav .badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--crit);color:#fff;padding:1px 6px;border-radius:999px;}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line-2);}
  .op{display:flex;align-items:center;gap:10px;padding:6px 8px;}
  .op .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--water));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;}
  .op b{font-size:13px;}.op small{display:block;color:var(--muted);font-size:11px;}
  .themebtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px;color:var(--muted);font-size:12px;}

  /* main */
  .main{position:relative;min-width:0;}
  .topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 22px;}
  .backbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:30px;height:30px;border-radius:9px;font-size:20px;line-height:1;display:grid;place-items:center;padding:0 0 3px;transition:.12s;flex:none;}
  .backbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-deep);}
  .backbtn:disabled{opacity:.35;cursor:default;}
  .topbar .crumb{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;}
  .topbar .status{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--good);}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .screen{padding:26px 30px 120px;max-width:960px;}
  .screen.wide{max-width:1040px;}

  h1{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;font-size:28px;margin:0 0 2px;}
  .sub{color:var(--muted);margin:0 0 20px;font-size:15px;}
  h2{font-family:var(--disp);font-weight:700;font-size:19px;margin:26px 0 12px;letter-spacing:-.01em;}
  h3{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 10px;font-weight:600;}

  .grid{display:grid;gap:14px;}.g2{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(3,1fr);}.g4{grid-template-columns:repeat(4,1fr);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);}
  .card.click{cursor:pointer;transition:.14s;}
  .card.click:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 24px rgba(14,26,32,.1);}
  .kh{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);display:block;margin-bottom:8px;}
  .card h4{margin:0 0 4px;font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:-.01em;}
  .card p{margin:.3em 0;font-size:13.5px;color:var(--ink-2);}

  .pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:999px;font-weight:600;}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .good{background:var(--good-wash);color:var(--good);}.warn{background:var(--warn-wash);color:var(--warn);}
  .crit{background:var(--crit-wash);color:var(--crit);}.info{background:var(--water-wash);color:var(--water);}
  .ai{background:var(--accent-wash);color:var(--accent-deep);}

  .gauge{--v:91;--c:var(--good);width:92px;height:92px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line-2) 0);display:grid;place-items:center;position:relative;}
  .gauge::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card);}
  .gauge b{position:relative;font-family:var(--disp);font-size:25px;font-weight:800;}.gauge b small{font-size:12px;color:var(--muted);}
  .readout{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}

  .sensors{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:10px;overflow:hidden;}
  .sensors .s{background:var(--card);padding:10px 12px;}
  .sensors .k{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--muted-2);text-transform:uppercase;}
  .sensors .v{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;}
  .sensors .v small{font-size:10.5px;color:var(--muted);}
  .up{color:var(--warn);}.down{color:var(--water);}.st{color:var(--good);}

  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);transition:.12s;}
  .chip:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-wash);}

  /* chat */
  .chat{display:flex;flex-direction:column;gap:12px;padding:4px 0;}
  .bub{max-width:80%;padding:11px 14px;border-radius:15px;font-size:14px;line-height:1.5;animation:rise .3s ease;}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bub.op{align-self:flex-end;background:var(--water-wash);color:var(--ink);border-bottom-right-radius:5px;}
  .bub.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:var(--shadow);}
  .bub.ai .who{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep);display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .bub.ai .who .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .bub ul{margin:8px 0 2px;padding-left:18px;}.bub li{margin:2px 0;}
  .typing{display:inline-flex;gap:4px;}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted-2);animation:blink 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .askbar{position:sticky;bottom:0;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 0 4px;margin-top:14px;}
  /* single rounded search box (radius matched to cards, not a pill) */
  .askrow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--card);
    border-radius:14px;padding:7px 7px 7px 8px;box-shadow:var(--shadow);transition:border-color .14s;}
  .askrow:focus-within{border-color:var(--accent);}
  .askrow input{flex:1;border:none;background:none;padding:9px 6px;font-size:15px;color:var(--ink);font-family:inherit;}
  .askrow input:focus{outline:none;}
  .iconbtn{border:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none;}
  .mic{background:transparent;color:var(--muted);}
  .mic:hover{background:var(--mist);color:var(--accent-deep);}
  .send{background:var(--accent);color:#fff;}
  .send:hover{background:var(--accent-deep);}
  /* Dr. Paani avatar chip */
  .drav{display:inline-flex;flex:none;align-items:center;}
  .drav svg{display:block;}

  /* stepper / task */
  .flow{display:flex;flex-direction:column;gap:8px;}
  .step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .step .n{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;background:var(--mist);color:var(--muted);}
  .step.done .n{background:var(--good-wash);color:var(--good);}
  .step.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash);}
  .step.now .n{background:var(--accent);color:#fff;}
  .step .h{font-weight:700;font-size:14px;}.step .d{font-size:12.5px;color:var(--muted);}
  .step.done{opacity:.62;}

  .tl{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .tl .d{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--card);}
  .tl .day{font-family:var(--mono);font-size:10px;color:var(--muted-2);text-transform:uppercase;}
  .tl .st2{font-size:12px;margin-top:5px;font-weight:600;line-height:1.25;}
  .tl .g{border-top:3px solid var(--good);}.tl .w{border-top:3px solid var(--warn);}
  .tl .c{border-top:3px solid var(--crit);}.tl .i{border-top:3px solid var(--water);}

  .callout{border:1px solid var(--line);border-left:3px solid var(--water);background:var(--water-wash);border-radius:0 12px 12px 0;padding:12px 15px;font-size:13.5px;color:var(--ink-2);}
  .callout.ac{border-left-color:var(--accent);background:var(--accent-wash);}
  .callout.wc{border-left-color:var(--warn);background:var(--warn-wash);}

  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;transition:.12s;}
  .btn:hover{border-color:var(--accent);}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.pri:hover{background:var(--accent-deep);}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  .src{font-family:var(--mono);font-size:11px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;cursor:pointer;}
  .src u{text-decoration-style:dotted;}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .big{font-size:34px;margin-bottom:8px;}

  .banner{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--crit-wash);color:var(--crit);font-size:13px;font-family:var(--mono);}
  .banner.warnb{background:var(--warn-wash);color:var(--warn);}

  .obtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;font-size:14px;font-weight:600;color:var(--ink);text-align:center;transition:.12s;}
  .obtn:hover{border-color:var(--accent);}
  .obtn.sel{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-deep);}

  .soptable{display:grid;grid-template-columns:auto auto 1fr;gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:9px;overflow:hidden;margin:10px 0 2px;}
  .soptable>div{background:var(--card);padding:7px 10px;font-size:12px;}
  .soptable .hh{background:var(--mist);font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
  .soptable .pp{font-weight:600;}.soptable .rr{font-family:var(--mono);color:var(--accent-deep);white-space:nowrap;}.soptable .tt{color:var(--muted);}
  .fig{margin:14px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);}
  .figbox{padding:14px 16px 6px;background:
    repeating-linear-gradient(0deg,transparent,transparent 22px,color-mix(in srgb,var(--line) 40%,transparent) 22px,color-mix(in srgb,var(--line) 40%,transparent) 23px);}
  .fig figcaption{padding:10px 16px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);line-height:1.45;}
  .fig figcaption b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep);}
  .figsrc{font-family:var(--mono);font-size:10.5px;color:var(--muted-2);}
  /* ---- explainer video player ---- */
  .player{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0c161b;box-shadow:var(--shadow);margin:14px 0;}
  .stage{position:relative;aspect-ratio:16/8;background:radial-gradient(120% 120% at 50% 0,#12242c,#0a1318);overflow:hidden;}
  .stage svg{position:absolute;inset:0;width:100%;height:100%;}
  .hud{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .hud .m{display:flex;gap:8px;align-items:center;background:rgba(10,20,25,.72);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:5px 9px;font-family:var(--mono);font-size:11px;color:#8fa2a6;opacity:.35;transition:.4s;}
  .hud .m.on{opacity:1;color:#eaf1f0;border-color:var(--accent);}
  .hud .m b{color:var(--accent-deep);color:#2CC2BA;}
  .caption{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(0deg,rgba(6,12,15,.9),transparent);color:#eaf1f0;font-size:14px;line-height:1.4;min-height:56px;display:flex;align-items:flex-end;}
  .bigplay{position:absolute;inset:0;margin:auto;width:60px;height:60px;border-radius:50%;border:none;background:rgba(44,194,186,.92);color:#04211f;font-size:24px;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.15s;}
  .bigplay:hover{transform:scale(1.06);}
  .transport{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0c161b;border-top:1px solid rgba(255,255,255,.07);}
  .transport .pp{border:none;background:none;color:#eaf1f0;font-size:15px;width:26px;cursor:pointer;}
  .track{flex:1;height:6px;background:rgba(255,255,255,.14);border-radius:3px;position:relative;cursor:pointer;}
  .track .prog{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;width:0;}
  .track .tick{position:absolute;top:-3px;width:2px;height:12px;background:rgba(255,255,255,.4);}
  .transport .time{font-family:var(--mono);font-size:11px;color:#8fa2a6;font-variant-numeric:tabular-nums;}
  .chapters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;background:#0c161b;border-top:1px solid rgba(255,255,255,.07);}
  .chapters .ch{font-size:11.5px;font-family:var(--mono);color:#8fa2a6;background:rgba(255,255,255,.06);border:1px solid transparent;border-radius:7px;padding:5px 9px;cursor:pointer;transition:.15s;}
  .chapters .ch:hover{color:#eaf1f0;}
  .chapters .ch.on{color:#eaf1f0;border-color:var(--accent);background:rgba(44,194,186,.14);}
  .flowdash{stroke-dasharray:6 8;animation:dash 1.1s linear infinite;}
  .player:not(.playing) .flowdash{animation-play-state:paused;}
  @keyframes dash{to{stroke-dashoffset:-28;}}
  @media (prefers-reduced-motion:reduce){.flowdash{animation:none;}}
  /* process health bars */
  .phrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;}
  .pbar{grid-column:1/-1;height:7px;background:var(--line-2);border-radius:4px;overflow:hidden;}
  .pbar i{display:block;height:100%;border-radius:4px;}
  /* ---- Ask: categorised question picker (Hick / Fitts / Doherty) ---- */
  .qbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  .qlauncher{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card);
    border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);transition:.14s;}
  .qlauncher:hover{border-color:var(--accent);color:var(--accent-deep);}
  .qlauncher .chev{color:var(--muted);transition:transform .2s;font-size:11px;}
  .qlauncher.open .chev{transform:rotate(180deg);}
  .qhint{font-size:12px;color:var(--muted-2);}
  .qhint button{border:none;background:none;color:var(--accent-deep);font:inherit;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;}
  .qpop{position:absolute;left:0;bottom:100%;margin-bottom:12px;width:min(460px,100%);
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 24px 60px rgba(14,26,32,.20),0 3px 10px rgba(14,26,32,.08);padding:8px;z-index:30;
    transform-origin:bottom left;animation:qpop .17s cubic-bezier(.2,.75,.3,1);}
  @keyframes qpop{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:none;}}
  .qpop .pophead{display:flex;align-items:center;gap:10px;padding:8px 10px 8px;}
  .qpop .pophead .qt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);}
  .qpop .pophead .qsub{font-size:13px;color:var(--muted);margin-left:auto;}
  .qback{border:1px solid var(--line);background:var(--card);border-radius:9px;width:30px;height:30px;flex:none;
    display:grid;place-items:center;font-size:17px;color:var(--ink);cursor:pointer;transition:.12s;}
  .qback:hover{border-color:var(--accent);color:var(--accent-deep);}
  .qlist{display:flex;flex-direction:column;gap:2px;animation:qslide .18s ease;}
  @keyframes qslide{from{opacity:0;transform:translateX(6px);}to{opacity:1;transform:none;}}
  .qrow{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;
    border:none;background:none;text-align:left;padding:11px 12px;border-radius:13px;cursor:pointer;transition:.12s;}

  if(!isBack){
    // push the screen we're leaving, avoid duplicate consecutive entries
    if(navHist.length===0 || navHist[navHist.length-1].screen!==window._cur?.screen){
      if(window._cur) navHist.push(window._cur);
    }
  }
  window._cur={screen,arg};
  if(back){back.disabled=navHist.length===0;}
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.go===screen));
  $('#crumb').textContent=CRUMB[screen]||screen;
  stage.innerHTML='';
  const s=el('<div class="screen fade"></div>');
  if(screen==='home') s.append(...home());
  else if(screen==='ask') s.append(...ask());
  else if(screen==='plant') s.append(...plant());
  else if(screen==='process') s.append(...process(arg));
  else if(screen==='equip') s.append(...equip(arg));
  else if(screen==='explain') s.append(...explain(arg));
  else if(screen==='biology') s.append(...biology());
  else if(screen==='diagnose') s.append(...diagnose(arg));
  else if(screen==='tasks') s.append(...tasks());
  else if(screen==='task') s.append(...taskmode(arg));
  else if(screen==='compliance') s.append(...compliance());
  else if(screen==='history') s.append(...history());
  stage.append(s);
  stage.scrollIntoView({block:'start'});
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.go));
$('#back').onclick=()=>{const prev=navHist.pop();if(prev)go(prev.screen,prev.arg,true);};

function diagramFor(name){
  const n=(name||'').toLowerCase();
  if(n.includes('clarifier'))return DIAGRAMS.clarifier();
  if(n.includes('uv'))return DIAGRAMS.uv();
  if(n.includes('aeration')||n.includes('basin')||n.includes('blower'))return DIAGRAMS.aeration();
  return '';
}

function ask(){
  const w=el(`<div>
    <h1>Ask Dr. Paani</h1>
    <p class="sub">Your plant's doctor. Ask in natural language or by voice — Dr. Paani already knows your live plant state.</p>
    <div class="chat" id="chat">
      <div class="bub ai"><div class="who">${DROP}Dr. Paani</div>Hello Rahul — I'm <b>Dr. Paani</b>, your plant's doctor 💧 I'm watching all 14 data sources. Ask me anything, or pick a topic below.</div>
    </div>
    <div class="askrow">
      <button class="iconbtn mic" title="Hold to speak">🎤</button>
      <input id="askin" placeholder="Ask Dr. Paani…" autocomplete="off">
      <button class="iconbtn send" id="asksend">↑</button>
    </div>
    <div class="sugg">
      <div class="sugg-h">
        <span class="kh" style="margin:0">Suggested questions</span>
        <span class="qhint">Hover a topic to see its questions · <button id="qwhy">why grouped?</button></span>
      </div>
      <div class="lawnote hidden" id="lawnote">
        <h6>Design principles applied here</h6>
        <div class="l"><b>Hick's Law</b><span>6 topic cards instead of 18 loose questions — fewer choices, faster decisions.</span></div>
        <div class="l"><b>Fitts's Law</b><span>Large cards and full-width question targets — quick to hit, glove-friendly.</span></div>
        <div class="l"><b>Doherty Threshold</b><span>Questions reveal on hover and Dr. Paani replies in well under 400 ms, so attention never breaks.</span></div>
      </div>
      <div class="qgrid" id="qgrid"></div>
    </div>
  </div>`);
  const chat=w.querySelector('#chat');
  const input=w.querySelector('#askin');
  function answer(q){
    const key=q.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
    let a=ASK_ANSWERS.default;
    for(const k in ASK_ANSWERS){if(k!=='default'&&key.includes(k.slice(0,14))){a=ASK_ANSWERS[k];break;}}
    chat.append(el(`<div class="bub op">${q}</div>`));
    const t=el(`<div class="bub ai"><div class="who">${DROP}Dr. Paani is reading ${a.src} sources <span class="typing"><i></i><i></i><i></i></span></div></div>`);
    chat.append(t);scrollChat();
    setTimeout(()=>{
      t.innerHTML=`<div class="who">${DROP}Dr. Paani · <span class="src"><u>${a.src} sources</u></span></div>${a.html}`;
      const cl=el(`<div class="chips" style="margin-top:10px;"></div>`);
      (a.chips||[]).forEach(c=>{const b=el(`<button class="chip">${c}</button>`);b.onclick=()=>answer(c);cl.append(b);});
      t.append(cl);
      if(a.cta){const b=el(`<div class="btnrow"><button class="btn pri">${a.cta.label}</button></div>`);b.querySelector('button').onclick=()=>go(a.cta.go,a.cta.arg);t.append(b);}
      scrollChat();
    },650);
  }
  // ---- visible category cards; questions disclosed on hover/focus ----
  const grid=w.querySelector('#qgrid');
  ASK_CATS.forEach(c=>{
    const card=el(`<div class="qcard" tabindex="0">
      <div class="qcard-h"><span class="qicon">${c.icon}</span><span><span class="tt">${c.label}</span><span class="dd">${c.desc}</span></span><span class="qcard-cue">›</span></div>
      <div class="qcard-qs"></div>
    </div>`);
    const qs=card.querySelector('.qcard-qs');
    c.qs.forEach(q=>{const b=el(`<button class="qq">${q}<span class="ar">→</span></button>`);b.onclick=()=>answer(q);qs.append(b);});
    grid.append(card);
  });
  w.querySelector('#qwhy').onclick=()=>w.querySelector('#lawnote').classList.toggle('hidden');
  w.querySelector('#asksend').onclick=()=>{if(input.value.trim()){answer(input.value.trim());input.value='';}};
  input.onkeydown=(e)=>{if(e.key==='Enter'&&input.value.trim()){answer(input.value.trim());input.value='';}};
  return [w];
}

function videoPlayer(key){
  const V=VIDEOS[key];
  if(!V)return el(`<div class="card"><span class="kh">Explainer</span><p class="sub" style="margin:0">No explainer video yet for this process. Once its SOP is mapped, a guided animation will appear here.</p></div>`);
  const dur=V.total/V.scenes.length;
  const wrap=el(`<div class="player">
    <div class="stage" id="stg">${V.svg}<div class="hud" id="hud"></div><div class="caption" id="cap"></div><button class="bigplay" id="big">▶</button></div>
    <div class="transport"><button class="pp" id="pp">▶</button><div class="track" id="trk"><div class="prog" id="prog"></div></div><span class="time" id="tm">0:00 / 0:00</span></div>
    <div class="chapters" id="chs"></div>
  </div>`);
  const hud=wrap.querySelector('#hud');
  V.hud.forEach((m,i)=>hud.append(el(`<div class="m" data-i="${i}"><span>${m.label}</span><b>${m.val}</b></div>`)));
  const chs=wrap.querySelector('#chs');
  V.scenes.forEach((s,i)=>{const b=el(`<button class="ch" data-i="${i}">${i+1}. ${s.t}</button>`);b.onclick=()=>{ct=i*dur+0.01;if(!playing)play();};chs.append(b);});
  const trk=wrap.querySelector('#trk');
  V.scenes.forEach((s,i)=>{if(i>0)trk.append(el(`<div class="tick" style="left:${i/V.scenes.length*100}%"></div>`));});
  const prog=wrap.querySelector('#prog'),cap=wrap.querySelector('#cap'),tm=wrap.querySelector('#tm'),pp=wrap.querySelector('#pp'),big=wrap.querySelector('#big');
  let ct=0,playing=false,raf=null,last=null;
  const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  function update(){
    const ci=Math.min(V.scenes.length-1,Math.floor(ct/dur));
    cap.textContent=V.scenes[ci].cap;
    prog.style.width=(ct/V.total*100)+'%';
    tm.textContent=`${fmt(ct)} / ${fmt(V.total)}`;
    hud.querySelectorAll('.m').forEach((m,i)=>m.classList.toggle('on',ci>=V.hud[i].ch));
    chs.querySelectorAll('.ch').forEach((c,i)=>c.classList.toggle('on',i===ci));
    V.render&&V.render(wrap,ct,ci);
  }
  function frame(ts){
    if(!document.body.contains(wrap)){raf=null;return;}       // navigated away
    if(!playing){raf=null;return;}                             // paused → let the page idle
    if(last==null)last=ts;const dt=(ts-last)/1000;last=ts;
    ct+=dt;
    if(ct>=V.total){ct=V.total;update();playing=false;raf=null;wrap.classList.remove('playing');pp.textContent='▶';big.textContent='↻';big.style.display='grid';return;}
    update();raf=requestAnimationFrame(frame);
  }
  function play(){if(ct>=V.total)ct=0;playing=true;wrap.classList.add('playing');pp.textContent='❚❚';big.style.display='none';last=null;if(!raf)raf=requestAnimationFrame(frame);}
  function pause(){playing=false;if(raf){cancelAnimationFrame(raf);raf=null;}wrap.classList.remove('playing');pp.textContent='▶';big.style.display='grid';big.textContent='▶';}
  big.onclick=()=>playing?pause():play();
  pp.onclick=()=>playing?pause():play();
  trk.onclick=(e)=>{const r=trk.getBoundingClientRect();ct=Math.max(0,Math.min(V.total,(e.clientX-r.left)/r.width*V.total));if(!playing)update();};
  update();
  return wrap;
}

function explain(topic){

    t.innerHTML=`<div class="who">${DROP}Dr. Paani · your plant</div>${INTRO(topic)} Here's how it works:`;
    if(fig){const f=el(`<div class="bub ai" style="max-width:100%;width:100%">${fig}</div>`);chat.append(f);}
    scrollChat();
  },800);
  const depths=DEPTHS(topic);

  depths.forEach(d=>{const b=el(`<button class="chip">${d}</button>`);b.onclick=()=>{
    chat.append(el(`<div class="bub op">${d}</div>`));

    setTimeout(()=>{tt.innerHTML=`<div class="who">${DROP}Dr. Paani · <span class="figsrc">SOP-referenced</span></div>${EXPLAIN_MORE(d,topic)}`;scrollChat();},700);
  };dc.append(b);});
  return [w];
}
function INTRO(topic){
  const n=(topic||'').toLowerCase();
  if(n.includes('clarifier'))return `In your plant, the ${topic} lets solids settle out by gravity. Right now the sludge blanket sits at <b>1.9&nbsp;m</b> and outlet turbidity is well under your <b>250&nbsp;NTU</b> ceiling. The rake sweeps settled sludge to the centre draw; your SOP says keep the scraper running <b>continuously</b> to avoid bulking.`;
  if(n.includes('uv'))return `In your plant, the ${topic} inactivates pathogens with ultraviolet light. Intensity is <b>88%</b> and runtime <b>21.4 h/day</b>. Your SOP target dose is <b>40–60&nbsp;mJ/cm²</b> for 99.9% disinfection — if intensity drops, the lamp needs replacing or the quartz sleeve cleaning.`;
  return `In your plant, ${topic} is where microbes eat the organic load. Right now DO is <b>2.3&nbsp;mg/L</b> (target 2.0) and Blower&nbsp;1 is in Auto at 62%. The blower feeds air so the bugs can breathe; too little and they suffocate, too much wastes energy. MLSS of <b>4,120&nbsp;mg/L</b> means a healthy population is doing the work.`;
}
function DEPTHS(topic){
  const n=(topic||'').toLowerCase();
  if(n.includes('clarifier'))return ['Go deeper — settling','What raises the blanket?','Show the SOP ranges','Why keep the scraper running?'];
  if(n.includes('uv'))return ['Go deeper — UV dose','Show the SOP ranges','Why does intensity drop?','When to replace the lamp?'];
  return ['Go deeper — the biology','Why does DO matter?','Show the SOP ranges','Explain today\'s DO trend'];
}
function EXPLAIN_MORE(d,topic){
  const n=(topic||'').toLowerCase();
  // ---- clarifier ----
  if(n.includes('clarifier')){
    if(d.includes('SOP'))return sopTable('Primary Clarifier',[['pH','6.5–7.5','Adjust inlet acid/base; tune coagulant dosing'],['Outlet TSS / turbidity','&lt; 250 NTU (good &lt;100)','&gt;150 → check dosing, settling & scraper'],['Sludge wasting','Per calc sheet','Too little → carryover; too much → thin sludge downstream']]);
    if(d.includes('blanket'))return `The blanket rises when solids arrive faster than they're drawn off — usually low RAS/WAS flow or a stalled scraper. Right now yours is <b>1.9&nbsp;m</b>. Your SOP: if outlet TSS climbs &gt;150&nbsp;ppm, increase blowdown and confirm the scraper is running.`;
    if(d.includes('scraper'))return `The SOP requires the scraper to run <b>continuously — even when flow is stopped</b>. If it halts, sludge compacts and bulks, then escapes over the weir as turbidity. It's the single most important habit for a clarifier.`;
    return `Settling is gravity separation: dense floc sinks, clear water rises to the weir. A firm, low blanket means good settling; a high slow blanket means bulking. I compare your blanket only against your own history.`;
  }
  // ---- UV ----
  if(n.includes('uv')){
    if(d.includes('SOP'))return sopTable('UV System',[['UV dose / intensity','40–60 mJ/cm²','Low → replace lamp; clean quartz sleeve'],['Disinfection','99.9%','Poor outlet → raise intensity, clean lamp'],['PPM','Lamp & pump monthly','Replace lamps per manufacturer schedule']]);
    if(d.includes('intensity drop'))return `Intensity falls for two reasons: <b>lamp ageing</b> (output decays over months) or a <b>fouled quartz sleeve</b> (film blocks the light). Your SOP says clean the sleeve first; if intensity is still low, replace the lamp.`;
    if(d.includes('replace'))return `Replace the lamp when intensity can't be restored above ~40&nbsp;mJ/cm² by cleaning, or at the manufacturer's hour limit. Yours is 6 months old and still at 88% — healthy. I'll flag it as it approaches end of life.`;
    return `UV dose = intensity × contact time. More flow means less contact time, so the SOP couples a flow limit with the dose target. Below 40&nbsp;mJ/cm² pathogens survive; that's why intensity is watched continuously.`;
  }
  // ---- aeration (default) ----
  if(d.includes('DO trend'))return `DO dipped to <b>1.4 mg/L</b> at 04:00 after the 04:10 backwash pulled flow while Blower 1 was still at 40% manual. It recovered to 2.3. This same dip appears most nights after backwash — normal for your plant, not a fault.`;
  if(d.includes('SOP'))return sopTable('Extended Aeration',[['DO','1.8–2.5 mg/L','Low → raise blower; high → trim to save energy'],['MLSS','Per F:M target','High → waste sludge; low → reduce wasting'],['Blower mode','Auto','Log any manual override each shift']]);
  if(d.includes('DO matter'))return `Below ~1.5 mg/L nitrifying bacteria slow down and ammonia can break through your discharge limit. Above ~3 you're just paying for electricity. That's why 2.0 is your sweet spot.`;
  return `The floc in your basin is a living community — bacteria, protozoa, rotifers. A healthy plant shows crawling ciliates under a microscope and settles into a firm brown blanket. Your last settling test looked textbook. I compare it only against your own history.`;
}
function sopTable(unit,rows){
  return `Straight from your <b>${unit}</b> SOP:

      <div class="hh">Parameter</div><div class="hh">Range</div><div class="hh">If out of range</div>
      ${rows.map(([p,r,t])=>`<div class="pp">${p}</div><div class="rr">${r}</div><div class="tt">${t}</div>`).join('')}
    </div>`;
}

// Diagnostics landing: the list of open faults to work through.
function diagnose(faultKey){
  if(!faultKey||!FAULTS[faultKey]) return faultList();
  return faultConvo(faultKey);
}
function faultList(){
  const keys=Object.keys(FAULTS);
  const w=el(`<div>
    <h1>Diagnostics</h1>
    <p class="sub">${keys.length} open issues to work through. Pick one — Dr. Paani turns its diagnostic tree into a conversation.</p>
    <div class="grid g2" id="faults"></div>
  </div>`);
  const f=w.querySelector('#faults');
  keys.forEach(k=>{const x=FAULTS[k];
    const c=el(`<button class="card click" style="text-align:left"><span class="kh">${x.eq}</span><h4>${x.symptom}</h4><p><span class="pill ${x.status}"><span class="dot"></span>${x.stat}</span> · ${x.causes.length} likely causes</p><p style="color:var(--accent-deep);font-weight:600;font-size:13px;margin-top:6px">Diagnose ›</p></button>`);
    c.onclick=()=>go('diagnose',k);f.append(c);});
  return [w];
}
function faultConvo(faultKey){
  const f=FAULTS[faultKey];
  const CAUSES=f.causes;
  const w=el(`<div>
    <h1>Diagnostics · ${f.eq}</h1>
    <p class="sub">The diagnostic tree, as a conversation. Pick any cause to investigate — Dr. Paani reads the live values, you do the physical checks.</p>
    <div class="chat" id="chat">
      <div class="bub op">${f.symptom}</div>
    </div>
    <div class="askbar"><div class="chips" id="opts"></div></div>
  </div>`);
  const chat=w.querySelector('#chat'),opts=w.querySelector('#opts');
  const ruledOut=new Set();
  function aiSay(html,then){
    const t=el(`<div class="bub ai"><div class="who">${DROP}Dr. Paani <span class="typing"><i></i><i></i><i></i></span></div></div>`);
    chat.append(t);scrollChat();
    setTimeout(()=>{t.innerHTML=`<div class="who">${DROP}Dr. Paani</div>${html}`;then&&then();scrollChat();},700);
  }
  function setOpts(list){opts.innerHTML='';list.forEach(([label,fn,dis])=>{const b=el(`<button class="chip"${dis?' disabled style="opacity:.4"':''}>${label}</button>`);if(!dis)b.onclick=()=>{chat.append(el(`<div class="bub op">${label}</div>`));fn();};opts.append(b);});}

  const NUM={4:'four',5:'five'};
  // ---- the cause menu: every cause is selectable, ranked ----
  function showCauses(intro){
    const remaining=CAUSES.filter(c=>!ruledOut.has(c.k));
    const rows=CAUSES.map((c,i)=>{
      const done=ruledOut.has(c.k);
      const rankPill=done?`<span class="figsrc">ruled out</span>`
        :c.rc==='muted'?`<span class="figsrc">${c.rank}</span>`:`<span class="pill ${c.rc}"><span class="dot"></span>${c.rank}</span>`;
      return `<div class="acause${done?' out':''}"><span class="anum">${i+1}</span><span class="aname">${c.name}</span>${rankPill}</div>`;
    }).join('');
    aiSay(`${intro} I've ranked what fits your live data best — <b>tap a cause below to investigate it</b>.
      <div class="assess">
        <div class="assess-h">${DROP} Dr. Paani's assessment · ${NUM[CAUSES.length]||CAUSES.length} likely causes</div>
        ${rows}
      </div>`,()=>{
      const chips=remaining.map(c=>[`Diagnose: ${c.name}`,()=>pickCause(c)]);
      chips.push(['Why this order?',()=>aiSay(`I rank by how well each fits your live data:<ul>${CAUSES.map(c=>`<li><b>${c.name}</b> — ${c.reason}</li>`).join('')}</ul>`,()=>showChoicesOnly())]);
      chips.push(['Has this happened before?',()=>aiSay(f.history,()=>showChoicesOnly())]);
      setOpts(chips);
    });
  }
  function showChoicesOnly(){
    const remaining=CAUSES.filter(c=>!ruledOut.has(c.k));
    setOpts(remaining.map(c=>[`Diagnose: ${c.name}`,()=>pickCause(c)]));
  }
  function pickCause(c){
    aiSay(`<b>Investigating ${c.name}.</b> Reading live: ${c.live}. ${c.ask}`,()=>{
      setOpts([
        [c.yes,()=>confirmCause(c)],
        [c.no,()=>{
          ruledOut.add(c.k);
          const left=CAUSES.filter(x=>!ruledOut.has(x.k));
          if(left.length){aiSay(`Good — that rules out <b>${c.name}</b>. ${left.length} cause${left.length>1?'s':''} left. Which next?`,()=>showChoicesOnly());}
          else{aiSay(`We've ruled out every standard cause. This warrants escalation — I'll log it for your shift engineer with the full check history.`,()=>setOpts([['Log for shift engineer',()=>go('history')]]));}
        }]
      ]);
    });
  }
  function confirmCause(c){
    aiSay(`That confirms it. <span class="pill warn"><span class="dot"></span>Root cause: ${c.name}.</span> Here's the fix and its remedial tasks — start them in any order.`,()=>{rootCard(c);});
  }

  // ---- root cause card: each task individually launchable ----
  function rootCard(c){
    const est=c.tasks.reduce((a,tk)=>a+(tk.go?20:10),0);
    const card=el(`<div class="card fade" style="margin-top:6px"><span class="kh">Root cause confirmed</span>
      <h4>${c.name}</h4><p>${c.fix}</p>
      <div class="rhead"><span class="kh" style="margin:0">Remedial tasks · tick each when done</span><span class="rest">⏱ est. ~${est} min total</span></div>
      <div id="tasks" class="rlist"></div>
      <div class="btnrow"><button class="btn" id="verify">Verify the fix</button><button class="btn" id="reopen">Try a different cause</button></div>
    </div>`);
    chat.append(card);opts.innerHTML='';
    const tl=card.querySelector('#tasks');
    c.tasks.forEach((tk)=>{
      const mins=tk.min||(tk.go?'~20 min':'~10 min');
      const row=el(`<div class="rtask">
        <div class="rbody"><div class="rname">${tk.t}</div><div class="rmeta">⏱ ${mins}${tk.go?' · step-by-step guide available':''}</div></div>
        ${tk.go?'<button class="rguide">▶ Guide</button>':''}
        <button class="rdone">Mark done</button>
      </div>`);
      const done=row.querySelector('.rdone');
      done.onclick=()=>{const on=row.classList.toggle('done');done.textContent=on?'✓ Done':'Mark done';};
      if(tk.go)row.querySelector('.rguide').onclick=()=>go('task',tk.go);
      tl.append(row);
    });
    card.querySelector('#verify').onclick=()=>{
      const[label,band,reading]=c.verify;
      const vc=el(`<div class="card fade" style="margin-top:12px"><span class="kh">Verification</span><h4>${label} test</h4><p>Target <b>${band}</b>. Live reading after fix: <b>${reading}</b> <span class="pill good"><span class="dot"></span>PASS</span></p><div class="btnrow"><button class="btn pri" id="closeit">✓ Close issue & log</button></div></div>`);
      card.querySelector('.btnrow').insertAdjacentElement('afterend',vc);
      vc.querySelector('#closeit').onclick=()=>closeIssue(c);
      scrollChat();
    };
    card.querySelector('#reopen').onclick=()=>{aiSay(`No problem — the fix didn't resolve it. Let's reconsider the other causes.`,()=>showChoicesOnly());};
    scrollChat();
  }
  function closeIssue(c){
    HISTORY.forEach(e=>e.latest=false);
    HISTORY.unshift({group:'Today',time:'Now',ampm:'',status:'good',type:'issue',latest:true,
      title:`${f.eq} — ${c.name} resolved`,where:`${f.eq}`,who:'Dr. Paani + Rahul K.',dp:true,note:c.fix});
    w.innerHTML=`
      <div class="success fade">
        <div class="successmark">✓</div>
        <h1 style="text-wrap:balance">Issue closed</h1>
        <p class="sub" style="margin-bottom:18px">${f.eq} · ${c.name}</p>
        <div class="card" style="max-width:460px;margin:0 auto;text-align:left">
          <div class="srow"><span>Root cause</span><b>${c.name}</b></div>
          <div class="srow"><span>Fix applied</span><b>${c.fix}</b></div>
          <div class="srow"><span>Verified</span><b class="okc">✓ ${c.verify[0]} ${c.verify[2]}</b></div>
          <div class="srow"><span>Closed by</span><b>${DROP} Dr. Paani + Rahul K.</b></div>
        </div>
        <p style="color:var(--muted);font-size:13px;margin-top:14px">Logged to History automatically.</p>
        <div class="btnrow" style="justify-content:center"><button class="btn pri" id="toh">View in History</button><button class="btn" id="don">Back to Diagnostics</button></div>
      </div>`;
    w.querySelector('#toh').onclick=()=>go('history');
    w.querySelector('#don').onclick=()=>go('diagnose');
    window.scrollTo(0,0);
  }

  showCauses(f.intro);
  return [w];
}

  const tl=w.querySelector('#htl');
  function paint(){
    hf.querySelectorAll('.hfilter').forEach((b,i)=>b.classList.toggle('on',HFILTERS[i][0]===histFilter));
    tl.innerHTML='';
    const items=HISTORY.filter(e=>histFilter==='all'||e.type===histFilter);
    if(!items.length){tl.append(el(`<div class="empty"><div class="big">🗂️</div>No ${histFilter} entries yet.</div>`));return;}
    let lastGroup=null;
    items.forEach(e=>{
      if(e.group!==lastGroup){tl.append(el(`<div class="hgroup">${e.group}</div>`));lastGroup=e.group;}
      const av=e.dp?`<span class="hav dp">${DROP}</span>`:`<span class="hav" style="background:linear-gradient(135deg,var(--accent),var(--water))">${e.initials||'•'}</span>`;
      const tag=e.go?'button':'div';
      const statusLabel=e.status==='good'?'Resolved':'Monitoring';
      const ev=el(`<div class="hev${e.latest?' latest':''}">
        <div class="when"><b>${e.time}</b>${e.ampm?`<small>${e.ampm}</small>`:''}</div>
        <div class="rail"><span class="node ${e.status}${e.latest?' pulse':''}"></span></div>
        <div class="body">
          <${tag} class="hcard">
            <div class="htop"><h4>${e.title}</h4>${e.latest?'<span class="latestbadge">✓ Just closed</span>':''}<span class="htype">${e.type}</span>${e.go?'<span class="go">›</span>':''}</div>
            <div class="hmeta">
              <div class="row"><span class="mi">⬡</span>${e.where}</div>
              ${e.note?`<div class="row"><span class="mi">✎</span>${e.note}</div>`:''}
              <div class="row person">${av}${e.who} · <span style="color:var(--muted-2)">${statusLabel}</span></div>
            </div>
          </${tag}>
        </div>
      </div>`);
      if(e.go)ev.querySelector('.hcard').onclick=()=>go(e.go[0],e.go[1]);
      tl.append(ev);
    });
  }
  paint();
  return [w];
}

/* generic link wiring */
function wireLinks(root){
  root.querySelectorAll('[data-go2]').forEach(b=>b.onclick=()=>go(b.dataset.go2,b.dataset.arg));
}

go('home');
</script>
