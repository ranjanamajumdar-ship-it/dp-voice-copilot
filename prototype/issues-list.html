<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>13 · Issues List — Digital Paani</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#092454; --navy-mid:#1a2d5d; --navy-tint:#E8EBF2;
  --teal:#6AA8B0; --teal-deep:#3F7A83; --teal-light:#B0C3D6; --teal-tint:#E8F0F2;
  --sage-forest:#2E5924; --sage-tint:#F1F8EC;
  --rust:#C4511E; --rust-tint:#FAF0EB;
  --paper:#F7F6F2; --ink:#1A1A1A; --muted:#6F6F6F; --muted-2:#7C7C7C;
  --line:#E0DDD3; --line-soft:#EDEBE4; --white:#fff;
  --sev-emg:#A32015; --sev-emg-tint:#FBECEA;
  --sev-maj:#C4511E; --sev-maj-tint:#FAF0EB;
  --sev-min:#8A6410; --sev-min-tint:#FBF4E4;
  --sev-inf:#41637F; --sev-inf-tint:#ECF1F5;
  --t-ok:#3F7A83; --t-ok-bg:#E8F0F2;
  --t-warn:#8A6410; --t-warn-bg:#FBF4E4;
  --t-late:#A32015; --t-late-bg:#FBECEA;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'IBM Plex Sans','Noto Sans Devanagari',-apple-system,sans-serif;}
html[lang=hi] body{line-height:1.55;}
body{background:linear-gradient(160deg,#E3E0D8 0%,#D2CEC3 100%);color:var(--ink);min-height:100vh;padding:22px 18px 60px;}
button{font:inherit;}

/* ══════════ SPEC CHROME ══════════ */
.spec{max-width:1400px;margin:0 auto;}
.spec-head{margin-bottom:16px;}
.spec-head h1{font-size:19px;font-weight:600;letter-spacing:-.2px;}
.spec-head h1 b{color:var(--teal-deep);font-weight:600;}
.spec-head p{font-size:12.5px;color:var(--muted);margin-top:5px;max-width:700px;line-height:1.55;}

.controls{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;
  background:var(--white);border:1px solid var(--line);padding:12px 16px;margin-bottom:20px;}
.cgroup{display:flex;align-items:center;gap:9px;}
.cgroup>label{font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted-2);}
.seg{display:flex;border:1px solid var(--line);overflow:hidden;}
.seg button{font-size:11.5px;font-weight:600;padding:7px 13px;border:none;background:var(--white);
  color:var(--muted);cursor:pointer;border-right:1px solid var(--line);transition:.12s;white-space:nowrap;}
.seg button:last-child{border-right:none;}
.seg button.sel{background:var(--navy);color:#fff;}
.seg button:not(.sel):hover{background:var(--navy-tint);color:var(--navy);}
.seg.sm button{font-size:11px;padding:6px 10px;}
select.ctl{font-size:11.5px;font-weight:600;padding:6px 8px;border:1px solid var(--line);
  background:var(--white);color:var(--navy);cursor:pointer;}

.stage{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}

.frame-mobile{width:375px;height:790px;flex-shrink:0;background:var(--paper);
  border-radius:38px;border:6px solid #B8B4A8;box-shadow:0 24px 64px rgba(26,26,26,.3);
  overflow:hidden;display:flex;flex-direction:column;position:relative;}
.frame-desktop{flex:1 1 860px;min-width:0;height:790px;background:var(--paper);border:1px solid #B8B4A8;
  border-radius:8px;box-shadow:0 24px 64px rgba(26,26,26,.26);overflow:hidden;
  display:flex;flex-direction:column;position:relative;}
.browserbar{height:32px;background:#DEDAD0;border-bottom:1px solid #C9C4B8;
  display:flex;align-items:center;gap:7px;padding:0 13px;flex-shrink:0;}
.browserbar i{width:9px;height:9px;border-radius:50%;background:#BDB8AC;}
.browserbar .url{margin-left:12px;font-size:10.5px;color:var(--muted);background:var(--white);padding:3px 12px;border-radius:3px;}

/* ══════════ APP CHROME ══════════ */
.statusbar{height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:12.5px;font-weight:600;background:var(--navy);color:#fff;}
.appbar{flex-shrink:0;background:var(--navy);color:#fff;padding:0 14px;height:52px;
  display:flex;align-items:center;gap:10px;}
.appbar .plant{font-size:14.5px;font-weight:600;white-space:nowrap;}
.appbar .plant small{display:block;font-size:10px;font-weight:500;color:var(--teal-light);margin-top:1px;}
.appbar .sp{margin-left:auto;}
.appbar .ib{flex-shrink:0;background:none;border:none;color:#fff;font-size:16px;cursor:pointer;
  padding:7px;opacity:.92;line-height:1;border-radius:3px;}
.appbar .ib:hover{background:rgba(255,255,255,.14);}
.appbar .plantsel{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
  color:#fff;font-size:11.5px;font-weight:600;padding:6px 8px;cursor:pointer;}
.appbar .plantsel option{color:var(--ink);}

/* quick filters — single-select (Hick's law) */
.qbar{flex-shrink:0;background:var(--white);border-bottom:1px solid var(--line);
  padding:10px 14px;display:flex;align-items:center;gap:7px;}
.q{font-size:11.5px;font-weight:600;padding:7px 12px;border:1px solid var(--line);
  background:var(--white);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.12s;}
.q:hover{border-color:var(--teal);color:var(--teal-deep);}
.q[aria-pressed=true]{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;}
.q .ct{font-variant-numeric:tabular-nums;opacity:.75;margin-left:3px;}
.fbtn{margin-left:auto;flex-shrink:0;font-size:11.5px;font-weight:600;padding:7px 11px;
  border:1px solid var(--navy-tint);background:var(--navy-tint);color:var(--navy);cursor:pointer;
  display:flex;align-items:center;gap:5px;}
.fbtn:hover{background:#DCE1EC;}
.fbtn .dot{background:var(--navy);color:#fff;font-size:9.5px;font-weight:700;
  min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;}

.appliedbar{flex-shrink:0;background:var(--teal-tint);border-bottom:1px solid var(--line);
  padding:7px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.appliedbar .al{font-size:10.5px;color:var(--teal-deep);font-weight:600;}
.appliedbar .clr{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--rust);
  background:none;border:none;cursor:pointer;text-decoration:underline;}

/* ══════════ LIST ══════════ */
.body{flex:1;overflow-y:auto;background:#EFEEE9;min-height:0;-webkit-overflow-scrolling:touch;}
.body::-webkit-scrollbar{width:0;}
.list{padding:6px 12px 26px;}

.sechead{display:flex;align-items:baseline;gap:8px;padding:16px 3px 7px;}
.sechead h2{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);}
.sechead .n{font-size:11px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}

/* card — proximity: title block, then one meta line, then one status line */
/* container, not a button — so action buttons can live inside it legally */
.card{background:var(--white);border:1px solid var(--line-soft);border-left:3px solid var(--line);
  margin-bottom:7px;display:flex;align-items:stretch;transition:.12s;}
.card:hover{border-color:var(--teal-light);box-shadow:0 3px 12px rgba(9,36,84,.08);}
.card .open{flex:1;min-width:0;background:none;border:none;text-align:left;
  padding:11px 12px;cursor:pointer;color:inherit;}
.card .open:focus-visible{outline:2px solid var(--teal-deep);outline-offset:-2px;}
.card .side{flex-shrink:0;display:flex;align-items:center;padding:0 6px 0 0;}
.card.emergency{border-left-color:var(--sev-emg);}
.card.major{border-left-color:var(--sev-maj);}
.card.minor{border-left-color:var(--sev-min);}
.card.info{border-left-color:var(--sev-inf);}

.r1{display:flex;align-items:center;gap:8px;}
.sev{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;
  letter-spacing:.7px;padding:3px 6px;line-height:1;white-space:nowrap;}
.sev i{font-style:normal;font-size:8.5px;}
.sev.emergency{background:var(--sev-emg-tint);color:var(--sev-emg);}
.sev.major{background:var(--sev-maj-tint);color:var(--sev-maj);}
.sev.minor{background:var(--sev-min-tint);color:var(--sev-min);}
.sev.info{background:var(--sev-inf-tint);color:var(--sev-inf);}
.due{flex-shrink:0;margin-left:auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:3px 7px;white-space:nowrap;}
.due.ok{background:var(--t-ok-bg);color:var(--t-ok);}
.due.warn{background:var(--t-warn-bg);color:var(--t-warn);}
.due.late{background:var(--t-late-bg);color:var(--t-late);}

.title{font-size:15px;font-weight:600;line-height:1.3;letter-spacing:-.1px;margin-top:7px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.meta{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
.r3{display:flex;align-items:center;gap:7px;margin-top:9px;}
.r3:empty{display:none;}

.tag{font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 6px;line-height:1;white-space:nowrap;}
.tag.approval{background:#EDE7F6;color:#4A3480;}
.tag.waiting{background:var(--t-warn-bg);color:var(--t-warn);}
.tag.chronic{background:#E9E4DC;color:#5C4F3C;}
.tag.recov{background:var(--sage-tint);color:var(--sage-forest);}
.who{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.ovf{flex-shrink:0;background:none;border:none;font-size:15px;color:var(--muted-2);
  padding:0 2px;cursor:pointer;line-height:1;opacity:.5;}
.card:hover .ovf{opacity:1;color:var(--navy);}

.chronicrow{background:#F2EEE7;border:1px solid var(--line);padding:13px 12px;
  display:flex;align-items:center;gap:9px;cursor:pointer;width:100%;text-align:left;margin-top:14px;}
.chronicrow:hover{background:#EDE8DF;}
.chronicrow .lbl{font-size:13px;font-weight:600;color:#5C4F3C;}
.chronicrow .sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.chronicrow .arw{margin-left:auto;font-size:15px;color:#8C7B62;}

.empty{padding:70px 26px;text-align:center;}
.empty .gl{font-size:28px;opacity:.25;}
.empty h3{font-size:15px;font-weight:600;margin-top:14px;color:var(--muted);}
.empty p{font-size:12px;color:var(--muted-2);margin-top:6px;line-height:1.5;}

.bnav{flex-shrink:0;height:56px;background:var(--white);border-top:1px solid var(--line);display:flex;}
.bnav button{flex:1;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:9.5px;font-weight:600;color:var(--muted-2);}
.bnav button .i{font-size:15px;line-height:1;}
.bnav button.on{color:var(--navy);box-shadow:inset 0 2px 0 var(--teal-deep);}

/* ══════════ DESKTOP ══════════ */
.dtop{display:flex;flex:1;min-height:0;}
.snav{width:186px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;padding:14px 0;}
.snav .brand{padding:0 16px 16px;color:#fff;font-size:13.5px;font-weight:600;}
.snav .brand small{display:block;font-size:9px;color:var(--teal-light);font-weight:500;letter-spacing:.4px;margin-top:2px;}
.snav a{display:flex;align-items:center;gap:9px;padding:9px 16px;color:rgba(255,255,255,.66);
  font-size:12.5px;font-weight:500;cursor:pointer;}
.snav a:hover{background:var(--navy-mid);color:#fff;}
.snav a.on{background:var(--navy-mid);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--teal);}
.snav a .i{font-size:14px;width:16px;}
.snav a .badge{margin-left:auto;font-size:9.5px;font-weight:700;background:var(--sev-emg);color:#fff;padding:1px 5px;border-radius:8px;}
.snav .sep{height:1px;background:rgba(255,255,255,.13);margin:12px 16px;}
.snav .me{margin-top:auto;padding:12px 16px 0;border-top:1px solid rgba(255,255,255,.13);color:#fff;font-size:11.5px;font-weight:600;}
.snav .me small{display:block;font-size:9.5px;color:var(--teal-light);font-weight:500;margin-top:2px;}

.dmain{flex:1;min-width:0;display:flex;flex-direction:column;}
.dbar{flex-shrink:0;background:var(--white);border-bottom:1px solid var(--line);
  padding:13px 22px;display:flex;align-items:center;gap:12px;}
.dbar h1{font-size:17px;font-weight:600;letter-spacing:-.2px;}
.dbar h1 small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px;}
.dbar .dsearch{margin-left:auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);
  padding:8px 11px;font-size:12px;color:var(--muted-2);width:210px;background:var(--paper);cursor:text;}

/* summary before detail — 3 tiles max (law of focus) */
.kpis{flex-shrink:0;display:flex;background:var(--white);border-bottom:1px solid var(--line);}
.kpi{padding:11px 22px;border-right:1px solid var(--line-soft);min-width:132px;}
.kpi .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.4px;}
.kpi .k{font-size:9.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted-2);margin-top:3px;}
.kpi.late .v{color:var(--sev-emg);}
.kpi.warn .v{color:var(--sev-min);}

.dbody{flex:1;overflow-y:auto;background:#EFEEE9;min-height:0;}
.dlist{padding:8px 22px 34px;}
.card.row .open{display:flex;align-items:center;gap:16px;padding:12px 14px;}
.card.row .cell{min-width:0;}
.card.row .issue{flex:1;min-width:0;}
.card.row .issue .title{margin-top:5px;}
.card.row .st{width:150px;flex-shrink:0;}
.card.row .who{margin-left:0;width:112px;flex-shrink:0;}
.card.row .due{margin-left:0;width:100px;text-align:center;flex-shrink:0;}
.card.row .acts{width:118px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;
  gap:2px;padding-right:8px;}
.abtn{font-size:11px;font-weight:600;padding:6px 11px;border:1px solid var(--line);
  background:var(--white);color:var(--navy);cursor:pointer;white-space:nowrap;}
.abtn:hover{background:var(--navy-tint);}
.abtn.pri{background:var(--navy);border-color:var(--navy);color:#fff;}
.abtn.ok{background:var(--sage-forest);border-color:var(--sage-forest);color:#fff;}

/* ══════════ SHEETS ══════════ */
.scrim{position:absolute;inset:0;background:rgba(9,36,84,.42);display:none;z-index:40;}
.scrim.on{display:block;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--white);z-index:50;
  display:none;flex-direction:column;max-height:86%;box-shadow:0 -8px 40px rgba(9,36,84,.28);}
.sheet.on{display:flex;}
.frame-desktop .sheet{left:auto;right:0;top:0;bottom:0;width:352px;max-height:none;box-shadow:-8px 0 40px rgba(9,36,84,.24);}
.sheet .sh{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;}
.sheet .sh h3{font-size:14.5px;font-weight:600;}
.sheet .sh .x{margin-left:auto;font-size:19px;color:var(--muted);cursor:pointer;
  background:none;border:none;line-height:1;padding:2px 4px;}
.sheet .sb{padding:16px;overflow-y:auto;flex:1;}
.sheet .sf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;}
.sheet .sf button{flex:1;font-size:12.5px;font-weight:600;padding:12px;border:1px solid var(--navy);
  background:var(--white);color:var(--navy);cursor:pointer;}
.sheet .sf button.pri{background:var(--navy);color:#fff;}

/* familiar native controls — Jakob's law */
.fg{margin-bottom:17px;}
.fg label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted-2);display:block;margin-bottom:6px;}
.fg select,.fg input{width:100%;font-size:13px;padding:10px;border:1px solid var(--line);
  background:var(--white);color:var(--ink);}
.fg select:focus,.fg input:focus{outline:2px solid var(--teal-deep);outline-offset:-1px;}

.actlist button{width:100%;text-align:left;font-size:13.5px;font-weight:500;padding:15px 4px;
  border:none;border-bottom:1px solid var(--line-soft);background:none;cursor:pointer;color:var(--ink);
  display:flex;align-items:center;gap:12px;}
.actlist button:hover{background:var(--paper);}
.actlist button .i{font-size:15px;width:20px;}
.actlist button small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:2px;}
.actlist button.danger{color:var(--rust);}

/* ══════════ RATIONALE — 3 axes only ══════════ */
.rat{flex:1 1 290px;min-width:280px;max-width:380px;background:var(--white);border:1px solid var(--line);padding:18px;}
.rat .eye{font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--teal-deep);}
.rat h3{font-size:15px;font-weight:700;margin-top:4px;}
.rat .who2{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.5;
  padding-bottom:14px;border-bottom:1px solid var(--line-soft);}
.rat .ax{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid var(--line-soft);}
.rat .ax .num{flex-shrink:0;width:19px;height:19px;background:var(--navy-tint);color:var(--navy);
  font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.rat .ax dt{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--navy);}
.rat .ax dd{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:3px;}
.rat .ax dd b{color:var(--ink);font-weight:600;}
.rat .fixed{margin-top:15px;padding:11px;background:var(--teal-tint);border-left:3px solid var(--teal-deep);}
.rat .fixed strong{font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--teal-deep);display:block;margin-bottom:5px;}
.rat .fixed p{font-size:11px;color:#2C5A61;line-height:1.5;}
</style>
</head>
<body>

<div class="spec">
  <div class="spec-head">
    <h1>Screen 13 · Issues List — <b>four roles, one structure</b></h1>
    <p>Issues are <b>assigned</b>, not claimed. Every role reads the same three sections in the same order, so there is one list to learn. Roles differ on only three things: <b>scope</b>, <b>powers</b>, and whether they manage <b>chronic</b> issues.</p>
  </div>

  <div class="controls">
    <div class="cgroup">
      <label>Role</label>
      <div class="seg" id="segPersona"></div>
      <select class="ctl" id="selRole" aria-label="Sub-role"></select>
    </div>
    <div class="cgroup">
      <label>View</label>
      <div class="seg sm" id="segView">
        <button data-v="mobile" class="sel">Mobile</button>
        <button data-v="desktop">Desktop</button>
      </div>
    </div>
    <div class="cgroup">
      <label>Language</label>
      <div class="seg sm" id="segLang">
        <button data-l="en" class="sel">English</button>
        <button data-l="hi">हिन्दी</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div id="device"></div>
    <div class="rat" id="rat"></div>
  </div>
</div>

<script>
/* ═════════════ i18n ═════════════ */
const S={
 en:{overdue:'Overdue',inprogress:'In Progress',notstarted:'Not Started',chronic:'Chronic',
   qAll:'All',qEmg:'Emergency',qApprove:'Needs approval',filters:'Filters',
   due:'Due',over:'overdue',find:'Search issues',step:(a,b)=>`Step ${a}/${b}`,
   chronicRow:n=>`${n} chronic issues`,chronicSub:'Recurring — counted separately',
   emptyH:'No open issues',emptyP:'Nothing needs attention right now.',
   noresH:'Nothing matches',noresP:'Try clearing the filters.',
   kOverdue:'Overdue',kApproval:'Needs you',kOpen:'Open',
   open:'Open',approve:'Approve',start:'Start',allPlants:'All plants',
   fSeverity:'Severity',fStatus:'Status',fZone:'Equipment / zone',fOperator:'Operator',fText:'Search',
   any:'Any',apply:'Apply',reset:'Reset',active:n=>`${n} filter${n>1?'s':''} applied`,clear:'Clear',
   readonly:'View only'},
 hi:{overdue:'अतिदेय',inprogress:'चालू',notstarted:'शुरू नहीं',chronic:'पुरानी',
   qAll:'सभी',qEmg:'आपातकाल',qApprove:'मंज़ूरी चाहिए',filters:'फ़िल्टर',
   due:'देय',over:'अतिदेय',find:'समस्या खोजें',step:(a,b)=>`चरण ${a}/${b}`,

/* ═════════════ STATE ═════════════ */
let st={persona:'operator',role:'l1',view:'mobile',lang:'en',
        quick:'all',plant:'p1',sheet:null,chronicOpen:false,
        f:{sev:'',status:'',zone:'',op:'',q:''}};
const t=()=>S[st.lang], P=()=>PERSONAS[st.persona], R=()=>P().roles[st.role];
const plantsOf=()=>R().plants;
const inView=()=>plantsOf().length>1&&st.plant==='all'?plantsOf():[st.plant];
const crossPlant=()=>inView().length>1;
const nFilters=()=>Object.values(st.f).filter(Boolean).length;

/* ═════════════ QUERY ═════════════ */
function base(){
  let l=ISSUES.filter(i=>inView().includes(i.plant));
  if(R().mine) l=l.filter(i=>i.who===ME);
  return l;
}
function visible(){
  let l=base();
  if(st.quick==='emg')     l=l.filter(i=>i.sev==='emergency');
  if(st.quick==='wait')    l=l.filter(i=>i.flag==='waiting');
  if(st.quick==='approve') l=l.filter(i=>i.flag==='approval');
  const f=st.f;
  if(f.sev)    l=l.filter(i=>i.sev===f.sev);
  if(f.status) l=l.filter(i=>i.status===f.status);
  if(f.zone)   l=l.filter(i=>i.zone===f.zone);
  if(f.op)     l=l.filter(i=>i.who===f.op);
  if(f.q)      l=l.filter(i=>i.title.toLowerCase().includes(f.q.toLowerCase()));
  return l;
}
const SECTIONS=['overdue','inprogress','notstarted'];   // one order, every role
function bucket(l,s){
  const out=l.filter(i=>i.status===s);
  out.sort((a,b)=>RANK[a.sev]-RANK[b.sev]||(s==='overdue'?b.age-a.age:a.due-b.due));
  return out;
}
const qCount=k=>{
  let l=base();
  if(k==='emg')     l=l.filter(i=>i.sev==='emergency');
  if(k==='wait')    l=l.filter(i=>i.flag==='waiting');
  if(k==='approve') l=l.filter(i=>i.flag==='approval');
  return l.filter(i=>i.status!=='chronic').length;
};

/* ═════════════ PIECES ═════════════ */
const mins=m=>{const a=Math.abs(m),h=Math.floor(a/60),x=a%60;return h?(x?`${h}h ${x}m`:`${h}h`):`${x}m`;};
function due(i){
  if(i.due<0) return `<span class="due late">+${mins(i.due)} ${t().over}</span>`;
  return `<span class="due ${i.due<=30?'warn':'ok'}">${t().due} ${mins(i.due)}</span>`;
}
const FLAG={approval:{en:'PENDING APPROVAL',hi:'मंज़ूरी बाकी',c:'approval'},
            waiting:{en:'WAITING',hi:'प्रतीक्षारत',c:'waiting'},
            recov:{en:'PHOTO NEEDED',hi:'फ़ोटो चाहिए',c:'recov'}};
const flagHtml=i=>i.flag?`<span class="tag ${FLAG[i.flag].c}">${FLAG[i.flag][st.lang]}</span>`:'';
const sevHtml=i=>`<span class="sev ${i.sev}"><i aria-hidden="true">${SHAPE[i.sev]}</i>${SEVL[st.lang][i.sev]}</span>`;
function metaHtml(i){
  const b=[];
  if(i.val) b.push(`<b>${i.val}</b>`);
  b.push(crossPlant()?PLANTS[i.plant]:i.zone);
  if(i.step) b.push(t().step(i.step,i.of));
  return `<div class="meta">${b.join(' · ')}</div>`;
}
const showWho=()=>!R().mine;

function primaryAction(i){
  const r=R();
  const b=(cls,label)=>`<button class="abtn ${cls}" data-id="${i.id}">${label}</button>`;
  if(P().readonly) return b('',t().open);
  if(i.flag==='approval'&&r.approve) return b('ok',t().approve);
  if(i.status==='notstarted'&&!r.reassign&&!r.config) return b('pri',t().start);
  return b('',t().open);
}
const ovfBtn=i=>P().readonly?'':
  `<button class="ovf" data-ovf="${i.id}" aria-label="More actions for ${i.title}">⋮</button>`;

function cardM(i){
  return `<div class="card ${i.sev}">
   <button class="open" data-id="${i.id}">
     <div class="r1">${sevHtml(i)}${due(i)}</div>
     <div class="title">${i.title}</div>
     ${metaHtml(i)}
     <div class="r3">${flagHtml(i)}${showWho()?`<span class="who">${i.who}</span>`:''}</div>
   </button>
   <div class="side">${ovfBtn(i)}</div>
  </div>`;
}
function cardD(i){
  return `<div class="card row ${i.sev}">
   <button class="open" data-id="${i.id}">
     <div class="cell issue">${sevHtml(i)}<div class="title">${i.title}</div>${metaHtml(i)}</div>
     <div class="cell st">${flagHtml(i)}</div>
     ${showWho()?`<span class="who">${i.who}</span>`:''}
     ${due(i)}
   </button>
   <div class="acts">${primaryAction(i)}${ovfBtn(i)}</div>
  </div>`;
}

function listHtml(desktop){
  const l=visible(); let h='',n=0;
  SECTIONS.forEach(s=>{
    const it=bucket(l,s); if(!it.length) return; n+=it.length;
    h+=`<div class="sechead"><h2>${t()[s]}</h2><span class="n">${it.length}</span></div>`;
    h+=it.map(desktop?cardD:cardM).join('');
  });
  if(P().chronic&&R().chronic!==false){
    const c=bucket(l,'chronic');
    if(c.length){
      n+=c.length;   // chronic is a result too — must not fall through to the empty state
      if(st.chronicOpen){
        h+=`<div class="sechead"><h2>${t().chronic}</h2><span class="n">${c.length}</span></div>`;
        h+=c.map(desktop?cardD:cardM).join('');
      }else{
        h+=`<button class="chronicrow" data-chronic="1"><div>
          <div class="lbl">${t().chronicRow(c.length)}</div>
          <div class="sub">${t().chronicSub}</div></div><span class="arw">›</span></button>`;
      }
    }
  }
  if(!n){
    const filtered=st.quick!=='all'||nFilters();
    h=`<div class="empty"><div class="gl">${filtered?'⌕':'◇'}</div>
      <h3>${filtered?t().noresH:t().emptyH}</h3><p>${filtered?t().noresP:t().emptyP}</p></div>`;
  }
  return h;
}

const QL={all:'qAll',emg:'qEmg',approve:'qApprove'};
function qbar(){
  const chips=P().quick.map(k=>{
    const c=k==='all'?'':`<span class="ct">${qCount(k)}</span>`;
    return `<button class="q" aria-pressed="${st.quick===k}" data-q="${k}">${t()[QL[k]]}${c}</button>`;
  }).join('');
  const n=nFilters();
  return `<div class="qbar">${chips}
    <button class="fbtn" data-sheet="filters">☰ ${t().filters}${n?`<span class="dot">${n}</span>`:''}</button></div>`;
}
function appliedBar(){
  if(!nFilters()) return '';
  return `<div class="appliedbar"><span class="al">${t().active(nFilters())}</span>
    <button class="clr" data-clearf="1">${t().clear}</button></div>`;
}

}
function mobile(){
  const single=plantsOf().length<2;
  return `<div class="frame-mobile">
   <div class="statusbar"><span>9:41</span><span>▮▮▮ ⚡</span></div>
   <div class="appbar">
     ${single?`<div class="plant">${PLANTS[inView()[0]]}<small>${R().label}${P().readonly?' · '+t().readonly:''}</small></div>`:plantSel()}
     <span class="sp"></span>
     <button class="ib" data-sheet="search" aria-label="${t().find}">🔍</button>
     <button class="ib" data-ovf="__screen" aria-label="More">⋮</button>

function kpis(){
  const l=visible().filter(i=>i.status!=='chronic');
  const k=[{c:'late',v:l.filter(i=>i.due<0).length,l:t().kOverdue}];
  if(R().approve) k.push({c:'warn',v:l.filter(i=>i.flag==='approval').length,l:t().kApproval});
  k.push({c:'',v:l.length,l:t().kOpen});
  return `<div class="kpis">${k.map(x=>`<div class="kpi ${x.c}"><div class="v">${x.v}</div><div class="k">${x.l}</div></div>`).join('')}</div>`;
}
function desktop(){
  const r=R(),od=visible().filter(i=>i.due<0).length;
  return `<div class="frame-desktop">
   <div class="browserbar"><i></i><i></i><i></i><span class="url">app.digitalpaani.com/issues</span></div>
   <div class="dtop">
    <div class="snav">
      <div class="brand">Digital Paani<small>${r.label.toUpperCase()}</small></div>
      <a><span class="i">🏭</span>Home</a>
      <a class="on"><span class="i">⚠</span>Issues${od?`<span class="badge">${od}</span>`:''}</a>

/* ═════════════ SHEETS — real, working controls ═════════════ */
function sel(name,label,opts,val){
  return `<div class="fg"><label for="f_${name}">${label}</label>
   <select id="f_${name}" data-fs="${name}">
     <option value="">${t().any}</option>
     ${opts.map(o=>`<option value="${o[0]}"${val===o[0]?' selected':''}>${o[1]}</option>`).join('')}
   </select></div>`;
}
function sheet(){
  if(!st.sheet) return '';
  const wrap=(title,body,foot='')=>`<div class="sheet on" role="dialog" aria-modal="true">
    <div class="sh"><h3>${title}</h3><button class="x" data-close="1" aria-label="Close">✕</button></div>
    <div class="sb">${body}</div>${foot}</div>`;

  if(st.sheet==='filters'){
    const scope=base();
    const sevs=Object.keys(SHAPE).filter(k=>scope.some(i=>i.sev===k));
    const stats=SECTIONS.concat(P().chronic?['chronic']:[]).filter(k=>scope.some(i=>i.status===k));
    return wrap(t().filters,
      sel('sev',t().fSeverity,sevs.map(k=>[k,SEVL[st.lang][k]]),st.f.sev)+
      sel('status',t().fStatus,stats.map(k=>[k,t()[k]]),st.f.status)+
      sel('zone',t().fZone,uniq(scope,'zone').map(z=>[z,z]),st.f.zone)+
      (R().mine?'':sel('op',t().fOperator,uniq(scope,'who').map(o=>[o,o]),st.f.op))+
      `<div class="fg"><label for="f_q">${t().fText}</label>
        <input id="f_q" type="text" data-fs="q" value="${st.f.q}" placeholder="${t().find}"></div>`,
      `<div class="sf"><button data-resetf="1">${t().reset}</button>
        <button class="pri" data-close="1">${t().apply}</button></div>`);
  }
  if(st.sheet==='search'){
    return wrap(t().find,
      `<div class="fg"><label for="f_q2">${t().fText}</label>
        <input id="f_q2" type="text" data-fs="q" value="${st.f.q}" placeholder="${t().find}" autofocus></div>`,
      `<div class="sf"><button class="pri" data-close="1">${t().apply}</button></div>`);
  }
  const r=R(),a=[];
  if(r.approve)  a.push({i:'✔',t:'Approve',s:'Release the blocked step'},
                        {i:'✕',t:'Reject',s:'Reason required',d:1});
  if(!P().readonly&&!R().mine) a.push({i:'👥',t:'Reassign',s:'Move to another operator'});
  if(r.config)   a.push({i:'⚙',t:'Open the rule behind this',s:'Jump to its threshold'});
  if(r.chronic)  a.push({i:'🏷',t:'Flag as chronic',s:'Accept as an ongoing condition'});
  if(r.close)    a.push({i:'🚫',t:'Close with reason',s:'Audit-logged',d:1});
  if(R().mine)   a.push({i:'🔗',t:'Report a linked issue',s:'This one has another cause'});
  return wrap(st.sheet==='__screen'?'Actions':`Issue ${st.sheet}`,
    `<div class="actlist">${a.map(x=>`<button class="${x.d?'danger':''}" data-close="1">
      <span class="i">${x.i}</span><div>${x.t}<small>${x.s}</small></div></button>`).join('')}</div>`);
}

function rat(){
  const p=P(),r=R();
  const names=Object.values(p.roles).map(x=>x.label).join(' · ');
  return `<div class="eye">Role ${Object.keys(PERSONAS).indexOf(st.persona)+1} of 4</div>
   <h3>${p.name}</h3>
   <div class="who2">${names}</div>
   ${p.axes.map(([k,v],n)=>`<div class="ax"><span class="num">${n+1}</span>
     <div><dt>${k}</dt><dd>${v}</dd></div></div>`).join('')}
   <div class="fixed"><strong>Why it’s simpler</strong><p>${p.fixed}</p></div>`;
}

/* ═════════════ RENDER ═════════════ */
function render(){
  document.documentElement.lang=st.lang;
  document.getElementById('segPersona').innerHTML=Object.entries(PERSONAS)
    .map(([k,v])=>`<button data-p="${k}" class="${st.persona===k?'sel':''}">${v.name}</button>`).join('');
  const rs=Object.entries(P().roles);
  const sr=document.getElementById('selRole');
  sr.innerHTML=rs.map(([k,v])=>`<option value="${k}"${st.role===k?' selected':''}>${v.label}</option>`).join('');
  sr.style.display=rs.length>1?'':'none';
  document.getElementById('device').innerHTML=st.view==='mobile'?mobile():desktop();
  document.getElementById('rat').innerHTML=rat();
}
function resetRole(){
  st.role=Object.keys(P().roles)[0];
  st.plant=plantsOf().length>1?'all':plantsOf()[0];
  st.quick='all'; st.f={sev:'',status:'',zone:'',op:'',q:''};
  st.sheet=null; st.chronicOpen=false;
}

document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s); let h;
  if(h=g('[data-p]')){ st.persona=h.dataset.p; resetRole(); return render(); }
  if(h=g('#segView button')){ st.view=h.dataset.v; st.sheet=null;
    document.querySelectorAll('#segView button').forEach(b=>b.classList.toggle('sel',b===h)); return render(); }
  if(h=g('#segLang button')){ st.lang=h.dataset.l;
    document.querySelectorAll('#segLang button').forEach(b=>b.classList.toggle('sel',b===h)); return render(); }
  if(h=g('[data-q]')){ st.quick=h.dataset.q; return render(); }
  if(h=g('[data-sheet]')){ st.sheet=h.dataset.sheet; return render(); }
  if(h=g('[data-ovf]')){ e.stopPropagation(); st.sheet=h.dataset.ovf; return render(); }
  if(g('[data-chronic]')){ st.chronicOpen=!st.chronicOpen; return render(); }
  if(g('[data-clearf]')){ st.f={sev:'',status:'',zone:'',op:'',q:''}; return render(); }
  if(g('[data-resetf]')){ st.f={sev:'',status:'',zone:'',op:'',q:''}; return render(); }
  if(g('[data-close]')){ st.sheet=null; return render(); }
});
/* dropdowns: commit on change, keep the sheet open so several can be set */
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='selRole'){ st.role=el.value;
    st.plant=plantsOf().length>1?'all':plantsOf()[0]; st.sheet=null; return render(); }
  if(el.dataset.plantsel!==undefined){ st.plant=el.value; return render(); }
  if(el.dataset.fs){ st.f[el.dataset.fs]=el.value; return render(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&st.sheet){ st.sheet=null; render(); }
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.fs){ st.f[e.target.dataset.fs]=e.target.value; st.sheet=null; render(); }
});

resetRole(); render();
</script>
</body>
</html>
